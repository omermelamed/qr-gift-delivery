<script>
        // Simple micro-interaction for the shield icon
        document.addEventListener('mousemove', (e) => {
            const shield = document.querySelector('.relative.w-40');
            if (shield) {
                const rect = shield.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = (y - centerY) / 20;
                const rotateY = (centerX - x) / 20;
                
                shield.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            }
        });
        
        document.addEventListener('mouseleave', () => {
            const shield = document.querySelector('.relative.w-40');
            if (shield) {
                shield.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            }
        });
    </script>

<script>
    (function initAnimations() {
        const io = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
            });
        }, { threshold: 0.05 });
        document.querySelectorAll('.enter, .enter-img').forEach(el => io.observe(el));
    })();
</script>
