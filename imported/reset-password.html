<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GiftFlow | Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#dce9ff",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#855300",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffddb8",
                        "tertiary-container": "#e29100",
                        "surface-dim": "#cbdbf5",
                        "secondary": "#545f73",
                        "surface-variant": "#d3e4fe",
                        "outline-variant": "#bbcabf",
                        "on-tertiary-container": "#523200",
                        "outline": "#6c7a71",
                        "on-secondary-fixed": "#111c2d",
                        "error-container": "#ffdad6",
                        "surface": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-secondary-container": "#586377",
                        "on-primary-container": "#00422b",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#eff4ff",
                        "on-background": "#0b1c30",
                        "primary-fixed": "#6ffbbe",
                        "inverse-primary": "#4edea3",
                        "primary-fixed-dim": "#4edea3",
                        "on-secondary-fixed-variant": "#3c475a",
                        "surface-container-highest": "#d3e4fe",
                        "secondary-fixed-dim": "#bcc7de",
                        "background": "#f8f9ff",
                        "surface-tint": "#006c49",
                        "on-surface": "#0b1c30",
                        "surface-bright": "#f8f9ff",
                        "inverse-surface": "#213145",
                        "surface-container": "#e5eeff",
                        "primary": "#006c49",
                        "on-tertiary-fixed": "#2a1700",
                        "on-error": "#ffffff",
                        "primary-container": "#10b981",
                        "on-primary-fixed-variant": "#005236",
                        "secondary-fixed": "#d8e3fb",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-primary-fixed": "#002113",
                        "on-surface-variant": "#3c4a42",
                        "secondary-container": "#d5e0f8",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "xs": "4px",
                        "xl": "40px",
                        "sm": "8px",
                        "base": "4px",
                        "container-max": "1280px",
                        "md": "16px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "mono-data": ["JetBrains Mono"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "mono-data": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .login-card {
            box-shadow: 0px 4px 20px rgba(30, 41, 59, 0.05);
            border: 1px solid #E2E8F0;
        }
        .auth-input:focus {
            border-color: #006c49;
            box-shadow: 0 0 0 2px rgba(0, 108, 73, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-[400px] flex flex-col items-center">
<!-- Brand Identity -->
<header class="flex flex-col items-center mb-10">
<div class="bg-primary p-3 rounded-xl mb-4 text-on-primary">
<span class="material-symbols-outlined text-4xl" data-icon="inventory_2">inventory_2</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-background tracking-tight">GiftFlow</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-1 uppercase">Corporate Logistics</p>
</header>
<!-- Login Canvas -->
<main class="login-card bg-surface-container-lowest w-full rounded-xl overflow-hidden relative">
<!-- Inline Error Banner -->
<div class="bg-error-container text-on-error-container px-lg py-sm flex items-center gap-2 transition-all duration-300" id="error-banner">
<span class="material-symbols-outlined text-sm" data-icon="error">error</span>
<span class="font-body-md text-body-md">Invalid email or password</span>
</div>
<div class="p-lg">
<div class="mb-lg">
<h2 class="font-title-md text-title-md text-on-surface">Sign in to your account</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Access your distribution dashboard.</p>
</div>
<form class="space-y-md" id="login-form">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">EMAIL ADDRESS</label>
<input class="auth-input w-full h-11 px-md bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none transition-all" id="email" name="email" placeholder="hr.admin@company.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">PASSWORD</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="auth-input w-full h-11 px-md pr-12 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-2">
<button class="w-full h-[44px] bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-title-md text-body-lg rounded-lg transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant flex flex-col items-center gap-sm">
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                        Managing large-scale corporate gifts?
                    </p>
<a class="font-label-md text-label-md text-secondary hover:text-primary flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-base" data-icon="contact_support">contact_support</span>
                        Contact Logistics Support
                    </a>
</div>
</div>
</main>
<!-- Contextual Decorative Element (Bento-style background hint) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 opacity-30 pointer-events-none">
<div class="absolute top-10 left-10 w-64 h-64 bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-20 right-20 w-80 h-80 bg-surface-dim/40 rounded-full blur-[100px]"></div>
</div>
<!-- Footer Footer -->
<footer class="mt-xl text-center">
<p class="font-label-md text-label-md text-on-surface-variant opacity-60">
                © 2024 GiftFlow Corporate Logistics Engine. v2.4.1
            </p>
</footer>
</div>
<script>
        // Micro-interactions for login experience
        const loginForm = document.getElementById('login-form');
        const errorBanner = document.getElementById('error-banner');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulate button loading state
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                // Show error again for visual persistence in this static demo
                errorBanner.style.opacity = '1';
                errorBanner.style.transform = 'translateY(0)';
            }, 800);
        });

        // Interactive visibility toggle
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        });
    </script>
</body></html>
